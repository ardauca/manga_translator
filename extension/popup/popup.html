<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manga Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Manga Translator</h1>

    <div class="control-panel">
      <button id="startSelectionBtn" class="btn btn-primary">
        <span class="icon">+</span>
        Seçimi Başlat
      </button>

      <button id="stopSelectionBtn" class="btn btn-secondary" disabled>
        <span class="icon">x</span>
        İptal Et
      </button>
    </div>

    <div class="settings-section">
      <h3>Ayarlar</h3>

      <div class="setting-item">
        <label for="sourceLang">Kaynak Dil</label>
        <select id="sourceLang">
          <option value="auto">Otomatik</option>
          <option value="ja">Japonca</option>
          <option value="en">İngilizce</option>
        </select>
      </div>

      <div class="setting-item">
        <label for="fontSize">Yazı Boyutu</label>
        <input type="range" id="fontSize" min="12" max="24" value="14">
        <span id="fontSizeValue">14px</span>
      </div>

      <div class="setting-item">
        <label for="opacity">Opaklık</label>
        <input type="range" id="opacity" min="0.3" max="1" step="0.1" value="0.95">
        <span id="opacityValue">95%</span>
      </div>

      <div class="setting-item setting-item-column">
        <label for="backendUrl">Backend URL</label>
        <input type="text" id="backendUrl" value="http://localhost:8000">
      </div>
    </div>

    <div class="status">
      <p id="statusText">Hazır</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
