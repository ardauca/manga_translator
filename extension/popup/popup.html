<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manga Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>Manga Translator</h1>
        <p>Clean manga reading, translated in place.</p>
      </div>
      <span id="backendBadge" class="status-dot status-muted" title="Backend status"></span>
    </header>

    <section class="hero-control">
      <button id="toggleSelectionBtn" class="primary-button">Start Reading</button>
      <label class="switch-row">
        <span>Show translations</span>
        <input id="translationsVisible" type="checkbox" checked>
        <span class="switch"></span>
      </label>
    </section>

    <section class="card">
      <div class="card-heading">
        <h2>Bubble Settings</h2>
      </div>

      <div class="setting-line">
        <label for="maxOverlays">Bubble limit</label>
        <input type="range" id="maxOverlays" min="1" max="20" value="8">
        <span id="maxOverlaysValue" class="value-badge">8</span>
      </div>

      <div class="setting-line">
        <label for="overlayTtl">Auto-hide</label>
        <select id="overlayTtl">
          <option value="0">Never</option>
          <option value="10">10 sec</option>
          <option value="30">30 sec</option>
          <option value="60">1 min</option>
          <option value="180">3 min</option>
        </select>
        <span id="overlayTtlValue" class="value-badge">Never</span>
      </div>

      <div class="setting-line">
        <label for="fontSize">Text size</label>
        <input type="range" id="fontSize" min="12" max="24" value="14">
        <span id="fontSizeValue" class="value-badge">14px</span>
      </div>

      <div class="setting-line">
        <label for="opacity">Background</label>
        <input type="range" id="opacity" min="0.45" max="1" step="0.05" value="0.95">
        <span id="opacityValue" class="value-badge">95%</span>
      </div>
    </section>

    <section class="recent-section">
      <div class="section-heading">
        <h2>Recent Translations</h2>
        <button id="clearHistoryBtn" class="text-button">Clear</button>
      </div>
      <div id="historyList" class="history-list">
        <p class="empty-state">Translations will appear here after you select a bubble.</p>
      </div>
    </section>

    <details class="advanced">
      <summary>Advanced <span>&gt;</span></summary>
      <div class="advanced-body">
        <label>
          Source language
          <select id="sourceLang">
            <option value="auto">Auto</option>
            <option value="ja">Japanese</option>
            <option value="en">English</option>
          </select>
        </label>
        <label>
          Backend URL
          <input type="text" id="backendUrl" value="http://localhost:8000">
        </label>
      </div>
    </details>

    <footer class="footer-status">
      <span class="ready-dot"></span>
      <span id="statusText">Ready to translate</span>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
